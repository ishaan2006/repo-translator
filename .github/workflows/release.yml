name: Release
# Pushing a tag like v1.2.0 builds the packages and publishes a pre-release with the
# Chrome zip and a source zip attached. Nothing is sent to any extension store.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build and test
        run: |
          node build.mjs
          node tests/background.test.mjs
      - name: Package
        run: |
          mkdir out
          cp dist/repo-translator-chrome.zip "out/repo-translator-chrome-${GITHUB_REF_NAME}.zip"
          git archive --format=zip --prefix="repo-translator-${GITHUB_REF_NAME#v}/" -o "out/repo-translator-source-${GITHUB_REF_NAME}.zip" HEAD
      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/*.zip \
            --prerelease --title "$GITHUB_REF_NAME (pre-release)" \
            --notes-file .github/release-notes.md
